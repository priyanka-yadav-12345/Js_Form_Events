<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <form action="" onSubmit = submitFunction() >
      <label for="">Name</label><input type="text" id="fname" onfocus="focusFunction(this)" onChange=" changeFunction(this)" onblur="blurFunction(this)" value="abc" oninput="inputFunction(this)" onSelect="selectFunction(this)" oninvalid="alert('Please fill the First Name.')" required><br><br>

       <option value="India">India</option>

       <option value="Banladesh">Bangladesh</option>
       <option value="Sri Lanka">Sri Lanka</option>

      </select>
      <input type="submit" onSubmit="submitFunction()">

    </form>
    <div id="test" style="border:1px solid red;"></div>
    <script >
      function focusFunction(element){
      //  document.getElementById("fname").style.background = "lime";
      element.style.background = "lime";
      }
      function blurFunction(element){
       element.style.background = "";
      }
      function inputFunction(element){
        var x = element.value;
        document.getElementById("test").innerHTML = x;
        
      }
      function changeFunction(element){
       var x = element.value;
       document.getElementById("test").innerHTML = x;
      }
      function selectFunction(element){
        console.log("You selcted some text.");
      }
      function submitFunction(){
      //  console.log("You submitted a form.");
      var x = document.getElementById("fname").value;
      //alert("You submitted a form.");
      alert("Hello"  + x);
      }
    </script>
